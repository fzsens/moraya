<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <!-- 定义圆角裁剪（更现代的圆润度，rx=42，接近 iOS 17+ 风格） -->
  <defs>
    <clipPath id="roundedModern">
      <rect 
        x="0" 
        y="0" 
        width="200" 
        height="200" />
    </clipPath>

    <!-- 现代化渐变背景（AI 科技感：深靛蓝 → 电光青，斜向渐变） -->
    <linearGradient 
      id="bgGradient" 
      x1="20" y1="20" 
      x2="180" y2="180" 
      gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#22D3EE" />
    </linearGradient>

    <!-- 轻微深度阴影（现代 App Icon 立体感） -->
    <filter 
      id="softShadow" 
      x="-20%" y="-20%" 
      width="140%" height="140%">
      <feDropShadow 
        dx="3" 
        dy="6" 
        stdDeviation="4" 
        flood-color="#0F172A" 
        flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- 圆角背景组 -->
  <g clip-path="url(#roundedModern)">
    <!-- 渐变背景 -->
    <rect 
      width="200" 
      height="200" 
      fill="url(#bgGradient)" />

    <!-- 极简 AI 科技网格（极淡的点阵线条，现代数字感，不抢 M 主体） -->
    <!-- 横向细线（仅下半部，模拟笔记纸张但数字化） -->
    <rect x="28" y="118" width="144" height="1.5" fill="#FFFFFF" opacity="0.12" />
    <rect x="28" y="134" width="144" height="1.5" fill="#FFFFFF" opacity="0.12" />
    <rect x="28" y="150" width="144" height="1.5" fill="#FFFFFF" opacity="0.12" />
  </g>

  <!-- 大写字母 M（绝对主体） - 超现代无衬线粗体，电光边缘 -->
  <!-- 字体：系统级现代字体，极粗，紧凑间距 -->
  <text
    x="100" 
    y="102" 
    text-anchor="middle" 
    dominant-baseline="middle" 
    font-family="system-ui, -apple-system, Arial Black, sans-serif" 
    font-size="118" 
    font-weight="900" 
    fill="#FFFFFF" 
    stroke="#0F172A" 
    stroke-width="7" 
    paint-order="stroke fill"
    letter-spacing="-6px"
    filter="url(#softShadow)">
    M
  </text>

  <!-- 外轮廓细边（极简现代感，增强圆角立体） -->
  <rect 
    x="1.5" 
    y="1.5" 
    width="197" 
    height="197"
    fill="transparent" 
    stroke="#FFFFFF" 
    stroke-width="3.5" 
    opacity="0.85" />

</svg>